<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 812" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="System flow: indexing, routing, retrieval, extraction, code checks, answer, verifier, combine, output, with the decision at each stage and the refusal path."><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker><marker id="ra" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C0392B"/></marker></defs><text x="8" y="20" font-size="14" font-weight="bold" fill="#111" text-anchor="start" >How a question becomes an answer with provenance</text><text x="8" y="36" font-size="8.5" font-weight="normal" fill="#444" text-anchor="start" >Left: each stage and its technology. Right: the decision made at that stage and why. Red: where the system refuses.</text><rect x="8" y="42" width="11" height="9" rx="2" fill="#FFF6D6" stroke="#B8962E"/><text x="23" y="50" font-size="8.5" font-weight="normal" fill="#333" text-anchor="start" >data / index</text><rect x="92.4" y="42" width="11" height="9" rx="2" fill="#E6F4EA" stroke="#3C8D5A"/><text x="107.4" y="50" font-size="8.5" font-weight="normal" fill="#333" text-anchor="start" >code (deterministic)</text><rect x="218.4" y="42" width="11" height="9" rx="2" fill="#E8EEFB" stroke="#4A67B5"/><text x="233.4" y="50" font-size="8.5" font-weight="normal" fill="#333" text-anchor="start" >LLM call</text><rect x="282.0" y="42" width="11" height="9" rx="2" fill="#F1F1F1" stroke="#555555"/><text x="297.0" y="50" font-size="8.5" font-weight="normal" fill="#333" text-anchor="start" >output</text><line x1="335.2" y1="46.5" x2="351.2" y2="46.5" stroke="#C0392B" stroke-dasharray="3 2"/><text x="355.2" y="50" font-size="8.5" font-weight="normal" fill="#C0392B" text-anchor="start" >refusal path</text><text x="8" y="76" font-size="9.5" font-weight="bold" fill="#333" text-anchor="start" letter-spacing="0.6">INDEX · once, offline</text><text x="338" y="76" font-size="9.5" font-weight="bold" fill="#333" text-anchor="start" letter-spacing="0.6">DECISION AND REASON</text><rect x="8" y="84" width="236" height="48" rx="6" fill="#FFF6D6" stroke="#B8962E" stroke-width="1"/><text x="18" y="99" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Parse 363 filings</text><text x="18" y="111.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >PyMuPDF · 54K pages · two text views per page</text><text x="338" y="94" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >Chunk = one PDF page, not a token window. Tables stay</text><text x="338" y="105" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >whole, and the page number is the provenance. Plain text</text><text x="338" y="116" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >feeds search. Layout text (columns joined by &quot;|&quot;) is what</text><text x="338" y="127" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >the model reads.</text><line x1="126.0" y1="132" x2="126.0" y2="145" stroke="#333" marker-end="url(#a)"/><rect x="8" y="146" width="236" height="48" rx="6" fill="#FFF6D6" stroke="#B8962E" stroke-width="1"/><text x="18" y="161" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Statement pack</text><text x="18" y="173.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >title regex + table density · about 4 pages per</text><text x="18" y="182.6" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >filing</text><text x="338" y="156" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >Most gold evidence is on the income statement, balance</text><text x="338" y="167" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >sheet or cash flow statement, so these pages are always</text><text x="338" y="178" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >shown to the model.</text><line x1="126.0" y1="194" x2="126.0" y2="207" stroke="#333" marker-end="url(#a)"/><rect x="8" y="208" width="236" height="48" rx="6" fill="#FFF6D6" stroke="#B8962E" stroke-width="1"/><text x="18" y="223" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Page embeddings</text><text x="18" y="235.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >Qwen3-Embedding-8B · NumPy in memory</text><text x="338" y="218" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >No vector database: 54K pages fit in memory. BM25 is built</text><text x="338" y="229" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >per filing at question time (largest filing: 667 pages).</text><text x="8" y="274" font-size="9.5" font-weight="bold" fill="#333" text-anchor="start" letter-spacing="0.6">ANSWER · for every question</text><text x="338" y="274" font-size="9.5" font-weight="bold" fill="#333" text-anchor="start" letter-spacing="0.6">DECISION AND REASON</text><rect x="8" y="282" width="236" height="48" rx="6" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="1"/><text x="18" y="297" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Route the question</text><text x="18" y="309.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >filing named → Path A. Else LLM picks company (1</text><text x="18" y="318.6" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >of 42), period, type → up to 3 filings (Path B)</text><text x="338" y="292" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >Path B keeps up to 3 candidate filings instead of guessing</text><text x="338" y="303" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >one. Each runs alone, so two filings never share a prompt.</text><line x1="244" y1="306.0" x2="256" y2="306.0" stroke="#C0392B" stroke-dasharray="3 2" marker-end="url(#ra)"/><text x="238" y="295" font-size="7.5" font-weight="normal" fill="#C0392B" text-anchor="end" >no company</text><line x1="126.0" y1="330" x2="126.0" y2="343" stroke="#333" marker-end="url(#a)"/><rect x="8" y="344" width="236" height="48" rx="6" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="1"/><text x="18" y="359" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Select about 12 pages</text><text x="18" y="371.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >statement pack + BM25 + dense, fused by reciprocal</text><text x="18" y="380.6" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >rank</text><text x="338" y="354" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >Picked on dev with a rule fixed in advance: the cheapest</text><text x="338" y="365" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >option within 5 points of the best. Gold-page recall 84% →</text><text x="338" y="376" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >87% with dense. LLM query planning added cost, not recall.</text><line x1="126.0" y1="392" x2="126.0" y2="405" stroke="#333" marker-end="url(#a)"/><rect x="8" y="406" width="236" height="48" rx="6" fill="#E8EEFB" stroke="#4A67B5" stroke-width="1"/><text x="18" y="421" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Call 1: extract values</text><text x="18" y="433.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >Qwen3.5 2B / 9B / 27B on vLLM · JSON schema</text><text x="18" y="442.6" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >enforced</text><text x="338" y="416" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >Each value comes with its page, exact quote, column,</text><text x="338" y="427" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >period and scale, plus a formula over value names. The</text><text x="338" y="438" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >model picks the numbers. It never does arithmetic.</text><line x1="126.0" y1="454" x2="126.0" y2="467" stroke="#333" marker-end="url(#a)"/><rect x="8" y="468" width="236" height="48" rx="6" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="1"/><text x="18" y="483" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Check and compute (Python)</text><text x="18" y="495.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >G3 quote is on the page · G5 formula whitelist ·</text><text x="18" y="504.6" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >evaluate</text><text x="338" y="478" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >Formulas may use only value names and avg, sum, cagr, abs,</text><text x="338" y="489" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >max, min. Constants only if they appear in the question. A</text><text x="338" y="500" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >failed check gets one retry with the error.</text><line x1="244" y1="492.0" x2="256" y2="492.0" stroke="#C0392B" stroke-dasharray="3 2" marker-end="url(#ra)"/><text x="238" y="481" font-size="7.5" font-weight="normal" fill="#C0392B" text-anchor="end" >fails twice</text><line x1="126.0" y1="516" x2="126.0" y2="529" stroke="#333" marker-end="url(#a)"/><rect x="8" y="530" width="236" height="48" rx="6" fill="#E8EEFB" stroke="#4A67B5" stroke-width="1"/><text x="18" y="545" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Call 2: write the answer</text><text x="18" y="557.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >plain text that cites [v1], [v2] · G4 number check</text><text x="338" y="540" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >Every number in the text must be a checked value or the</text><text x="338" y="551" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >computed result. One retry with the error.</text><line x1="244" y1="554.0" x2="256" y2="554.0" stroke="#C0392B" stroke-dasharray="3 2" marker-end="url(#ra)"/><text x="238" y="543" font-size="7.5" font-weight="normal" fill="#C0392B" text-anchor="end" >fails twice</text><line x1="126.0" y1="578" x2="126.0" y2="591" stroke="#333" marker-end="url(#a)"/><rect x="8" y="592" width="236" height="48" rx="6" fill="#E8EEFB" stroke="#4A67B5" stroke-width="1"/><text x="18" y="607" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Verifier</text><text x="18" y="619.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >Gemma 4 12B · cited pages as 150 dpi images</text><text x="338" y="602" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >A different model family, so it does not share the</text><text x="338" y="613" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >answering model&#x27;s mistakes. Checks period, unit, column</text><text x="338" y="624" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >and support. Anything but a clear yes is a refusal.</text><line x1="244" y1="616.0" x2="256" y2="616.0" stroke="#C0392B" stroke-dasharray="3 2" marker-end="url(#ra)"/><text x="238" y="605" font-size="7.5" font-weight="normal" fill="#C0392B" text-anchor="end" >not a clear yes</text><line x1="126.0" y1="640" x2="126.0" y2="653" stroke="#333" marker-end="url(#a)"/><rect x="8" y="654" width="236" height="48" rx="6" fill="#E6F4EA" stroke="#3C8D5A" stroke-width="1"/><text x="18" y="669" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Combine filings (G8)</text><text x="18" y="681.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >Path B only</text><text x="338" y="664" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >One filing answers → that answer. All agree → answer. They</text><text x="338" y="675" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >disagree → AMBIGUOUS, with each value and its source.</text><line x1="244" y1="678.0" x2="256" y2="678.0" stroke="#C0392B" stroke-dasharray="3 2" marker-end="url(#ra)"/><text x="238" y="667" font-size="7.5" font-weight="normal" fill="#C0392B" text-anchor="end" >filings disagree</text><line x1="126.0" y1="702" x2="126.0" y2="715" stroke="#333" marker-end="url(#a)"/><rect x="8" y="716" width="236" height="48" rx="6" fill="#F1F1F1" stroke="#555555" stroke-width="1"/><text x="18" y="731" font-size="10.5" font-weight="bold" fill="#111" text-anchor="start" >Answer row</text><text x="18" y="743.0" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >status · answer · computation · provenance ·</text><text x="18" y="752.6" font-size="8.2" font-weight="normal" fill="#333" text-anchor="start" >models</text><text x="338" y="726" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >Code attaches the provenance from checked values: filing,</text><text x="338" y="737" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >PDF page, quote, passage, column, scale. The LLM never</text><text x="338" y="748" font-size="8.6" font-weight="normal" fill="#222" text-anchor="start" >writes a page number. No checked citation, no answer.</text><rect x="256" y="292.0" width="70" height="400.0" rx="6" fill="#FDECEA" stroke="#C0392B" stroke-dasharray="4 3"/><text x="291.0" y="452.0" font-size="8.5" font-weight="bold" fill="#C0392B" text-anchor="middle" >NOT_FOUND</text><text x="291.0" y="463.0" font-size="8" font-weight="normal" fill="#C0392B" text-anchor="middle" >or</text><text x="291.0" y="474.0" font-size="8.5" font-weight="bold" fill="#C0392B" text-anchor="middle" >AMBIGUOUS</text><text x="291.0" y="485.0" font-size="8" font-weight="normal" fill="#C0392B" text-anchor="middle" ></text><text x="291.0" y="496.0" font-size="8" font-weight="normal" fill="#C0392B" text-anchor="middle" >with the</text><text x="291.0" y="507.0" font-size="8" font-weight="normal" fill="#C0392B" text-anchor="middle" >reason and</text><text x="291.0" y="518.0" font-size="8" font-weight="normal" fill="#C0392B" text-anchor="middle" >the pages</text><text x="291.0" y="529.0" font-size="8" font-weight="normal" fill="#C0392B" text-anchor="middle" >searched</text><text x="8" y="786" font-size="8.5" font-weight="normal" fill="#444" text-anchor="start" >Evaluation sits outside the system and never feeds it: code grades numeric answers and gpt-oss-20b grades text answers</text><text x="8" y="797" font-size="8.5" font-weight="normal" fill="#444" text-anchor="start" >against the gold answer. 51 dev questions for every choice above, 99 test questions run once.</text></svg>