<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 988" role="img" aria-label="Harness data flow: input, call 1 extract, quote check, formula check and Python compute, call 2 answer, number check, provenance, verifier, output, with retry loops and refusal rules."><rect width="800" height="988" fill="#fff"/><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker><marker id="ra" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#C0392B"/></marker></defs><text x="10" y="22" font-size="15" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Inside the harness: what data moves where, and what each check enforces</text><text x="10" y="39" font-size="10" font-weight="normal" fill="#444" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">One question, one filing. Left: the data at each step. Right: the rule. Red: what happens on a failure.</text><rect x="10" y="44" width="12" height="10" rx="2" fill="#F1F1F1" stroke="#555"/><text x="26" y="53" font-size="10" font-weight="normal" fill="#333" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">input</text><rect x="68.0" y="44" width="12" height="10" rx="2" fill="#E8EEFB" stroke="#4A67B5"/><text x="84.0" y="53" font-size="10" font-weight="normal" fill="#333" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">LLM call</text><rect x="142.8" y="44" width="12" height="10" rx="2" fill="#E6F4EA" stroke="#3C8D5A"/><text x="158.8" y="53" font-size="10" font-weight="normal" fill="#333" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">code check (deterministic)</text><rect x="318.4" y="44" width="12" height="10" rx="2" fill="#FFF6D6" stroke="#B8962E"/><text x="334.4" y="53" font-size="10" font-weight="normal" fill="#333" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">output</text><rect x="10" y="71" width="430" height="69" rx="6" fill="#F1F1F1" stroke="#555"/><text x="20" y="87" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Input</text><text x="20" y="103" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">question</text><text x="20" y="116" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">filing info: company, type, fiscal period</text><text x="20" y="129" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">pages: up to 12, layout text, &#x27;=== PAGE n ===&#x27;</text><text x="470" y="87.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Same input in the bare and full settings.</text><line x1="225.0" y1="140" x2="225.0" y2="155" stroke="#333" marker-end="url(#a)"/><rect x="10" y="156" width="430" height="95" rx="6" fill="#E8EEFB" stroke="#4A67B5"/><text x="20" y="172" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Call 1 · extract (Qwen3.5, JSON schema enforced by vLLM)</text><text x="20" y="188" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">status: found | not_applicable | not_found</text><text x="20" y="201" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">values[≤12]: {name, raw, scale, period,</text><text x="20" y="214" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">              column_header, page, quote}</text><text x="20" y="227" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">formula: names + avg/sum/cagr/abs/max/min</text><text x="20" y="240" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">display, out_scale, rounding, reason</text><text x="470" y="172.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">The schema forces this shape while the model</text><text x="470" y="185.5" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">decodes, so the output is always valid JSON.</text><text x="470" y="203.0" font-size="10.5" font-weight="bold" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">✗ status = not_found → NOT_FOUND (the model&#x27;s own refusal)</text><line x1="225.0" y1="251" x2="225.0" y2="266" stroke="#333" marker-end="url(#a)"/><rect x="10" y="267" width="430" height="95" rx="6" fill="#E6F4EA" stroke="#3C8D5A"/><text x="20" y="283" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">G3 · quote check, for each value</text><text x="20" y="299" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">page ∈ pages shown</text><text x="20" y="312" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">norm(quote) ⊂ norm(page text)   norm = drop spaces and &#x27;|&#x27;</text><text x="20" y="325" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   (or every part of the quote on one line of the page)</text><text x="20" y="338" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">raw ⊂ quote</text><text x="20" y="351" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">pass → value gets id v1, v2, … and a parsed number</text><text x="470" y="283.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Catches invented quotes, wrong pages and</text><text x="470" y="296.5" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">numbers that are not in their quote.</text><text x="470" y="314.0" font-size="10.5" font-weight="bold" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">✗ any fail → error list</text><text x="470" y="328.0" font-size="10" font-weight="normal" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">1st time: errors go back to the model as a message,</text><text x="470" y="341.0" font-size="10" font-weight="normal" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">and it tries once more. 2nd time: NOT_FOUND.</text><line x1="225.0" y1="362" x2="225.0" y2="377" stroke="#333" marker-end="url(#a)"/><rect x="10" y="378" width="430" height="95" rx="6" fill="#E6F4EA" stroke="#3C8D5A"/><text x="20" y="394" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">G5 · formula check, then Python computes</text><text x="20" y="410" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">parse formula; allow only value names and</text><text x="20" y="423" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   avg, sum, cagr, abs, max, min</text><text x="20" y="436" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">numbers allowed only if they appear in the question</text><text x="20" y="449" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">value × scale (millions → 1e6), evaluate in Python</text><text x="20" y="462" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">result → shown_text by display, out_scale, rounding</text><text x="470" y="394.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">The model never does arithmetic. A formula like</text><text x="470" y="407.5" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">x / 1000 is rejected: units come from out_scale.</text><text x="470" y="421.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">G3 and G5 errors go back to call 1 together.</text><text x="470" y="438.5" font-size="10.5" font-weight="bold" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">✗ any fail → error list</text><text x="470" y="452.5" font-size="10" font-weight="normal" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">1st time: errors go back to the model as a message,</text><text x="470" y="465.5" font-size="10" font-weight="normal" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">and it tries once more. 2nd time: NOT_FOUND.</text><line x1="225.0" y1="473" x2="225.0" y2="488" stroke="#333" marker-end="url(#a)"/><rect x="10" y="489" width="430" height="95" rx="6" fill="#E8EEFB" stroke="#4A67B5"/><text x="20" y="505" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Call 2 · write the answer (plain text)</text><text x="20" y="521" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">input: EVIDENCE  v1 name = raw (scale, period,</text><text x="20" y="534" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">       column, page): &quot;quote&quot;</text><text x="20" y="547" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">       COMPUTED RESULT  formula = shown_text</text><text x="20" y="560" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">       only the pages the quotes come from</text><text x="20" y="573" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">output: 1 to 4 sentences, cites [v1], [v2]</text><text x="470" y="505.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Call 2 sees checked values only, never the</text><text x="470" y="518.5" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">draft values that failed.</text><line x1="225.0" y1="584" x2="225.0" y2="599" stroke="#333" marker-end="url(#a)"/><rect x="10" y="600" width="430" height="82" rx="6" fill="#E6F4EA" stroke="#3C8D5A"/><text x="20" y="616" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">G4 · number check</text><text x="20" y="632" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">every number in the text ∈ checked values,</text><text x="20" y="645" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   the computed result, or numbers inside a checked quote</text><text x="20" y="658" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   (years, dates, page and note numbers are skipped)</text><text x="20" y="671" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">at least one citation [vN]; not cut off</text><text x="470" y="616.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Catches numbers the model made up while</text><text x="470" y="629.5" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">writing, and answers with no citation.</text><text x="470" y="647.0" font-size="10.5" font-weight="bold" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">✗ any fail → error list</text><text x="470" y="661.0" font-size="10" font-weight="normal" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">1st time: errors go back to the model as a message,</text><text x="470" y="674.0" font-size="10" font-weight="normal" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">and it tries once more. 2nd time: NOT_FOUND.</text><line x1="225.0" y1="682" x2="225.0" y2="697" stroke="#333" marker-end="url(#a)"/><rect x="10" y="698" width="430" height="69" rx="6" fill="#E6F4EA" stroke="#3C8D5A"/><text x="20" y="714" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Provenance (code)</text><text x="20" y="730" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">for each cited value: doc, PDF page, quote,</text><text x="20" y="743" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   passage (13 lines around the quote), column,</text><text x="20" y="756" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   period, scale   → status CANDIDATE</text><text x="470" y="714.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Built from checked values. The model never</text><text x="470" y="727.5" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">writes a page number.</text><line x1="225.0" y1="767" x2="225.0" y2="782" stroke="#333" marker-end="url(#a)"/><rect x="10" y="783" width="430" height="95" rx="6" fill="#E8EEFB" stroke="#4A67B5"/><text x="20" y="799" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Verifier (Gemma 4 12B, JSON schema)</text><text x="20" y="815" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">input: question, filing info, evidence list,</text><text x="20" y="828" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   computation, final answer,</text><text x="20" y="841" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   images of up to 4 cited pages at 150 dpi</text><text x="20" y="854" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">output: {period_ok, unit_ok, value_in_correct_column,</text><text x="20" y="867" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">   answer_supported: yes | partly | no, problem}</text><text x="470" y="799.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Pass only if the three checks are true and</text><text x="470" y="812.5" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">answer_supported = yes. No retry.</text><text x="470" y="830.0" font-size="10.5" font-weight="bold" fill="#C0392B" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">✗ anything else → NOT_FOUND with the verifier&#x27;s problem</text><line x1="225.0" y1="878" x2="225.0" y2="893" stroke="#333" marker-end="url(#a)"/><rect x="10" y="894" width="430" height="56" rx="6" fill="#FFF6D6" stroke="#B8962E"/><text x="20" y="910" font-size="11.5" font-weight="bold" fill="#111" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Output row</text><text x="20" y="926" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">ANSWER: answer, computation, provenance, models</text><text x="20" y="939" font-size="9.6" font-weight="normal" fill="#222" text-anchor="start" font-family="Menlo, Consolas, monospace">NOT_FOUND: reason (which check failed), pages searched</text><text x="470" y="910.0" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Path B: one row per candidate filing, then G8</text><text x="470" y="923.5" font-size="10.5" font-weight="normal" fill="#222" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">combines them (disagree → AMBIGUOUS).</text><path d="M440,314.5 H466 V203.5 H442" fill="none" stroke="#C0392B" stroke-dasharray="4 3" marker-end="url(#ra)"/><path d="M440,425.5 H448 V203.5 H442" fill="none" stroke="#C0392B" stroke-dasharray="4 3" marker-end="url(#ra)"/><path d="M440,641.0 H466 V536.5 H442" fill="none" stroke="#C0392B" stroke-dasharray="4 3" marker-end="url(#ra)"/><text x="10" y="970" font-size="9.5" font-weight="normal" fill="#444" text-anchor="start" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">Retry message (1st failure): &quot;Your output failed these checks: - &lt;errors&gt;. Fix them. Copy quotes exactly. If you cannot find exact evidence, use status not_found.&quot;</text></svg>